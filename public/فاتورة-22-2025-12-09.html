
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ايصال 22</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      padding: 20px;
      background: white;
      color: #000;
    }
    .invoice-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border: 2px solid #e5e7eb;
    }
    .invoice-header {
      text-align: center;
      border-bottom: 3px solid #3b82f6;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .invoice-header h1 {
      color: #3b82f6;
      font-size: 32px;
      margin-bottom: 10px;
    }
    .invoice-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .info-section {
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
    }
    .info-section h3 {
      color: #3b82f6;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .info-item {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
    }
    .invoice-details {
      margin: 30px 0;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      font-weight: bold;
      color: #6b7280;
    }
    .detail-value {
      color: #111827;
      font-weight: 600;
    }
    .total-section {
      background: #3b82f6;
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-top: 30px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid #e5e7eb;
      color: #6b7280;
    }
    @media print {
      body {
        padding: 0;
      }
      .invoice-container {
        border: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="invoice-container">
    <div class="invoice-header">
      <h1>ايصال / Invoice</h1>
      <p>رقم الايصال: 22</p>
    </div>
    
    <div class="invoice-info">
      <div class="info-section">
        <h3>معلومات العميل</h3>
        <div class="info-item">
          <span>الاسم:</span>
          <span>sddsf</span>
        </div>
        <div class="info-item">
          <span>التاريخ:</span>
          <span>2025-07-12</span>
        </div>
      </div>
      
      <div class="info-section">
        <h3>معلومات الايصال</h3>
        <div class="info-item">
          <span>النوع:</span>
          <span>العاشر</span>
        </div>
        <div class="info-item">
          <span>الحالة:</span>
          <span>مدفوعة</span>
        </div>
      </div>
    </div>
    
    <div class="invoice-details">
      <div class="detail-row">
        <span class="detail-label">المبلغ الإجمالي:</span>
        <span class="detail-value">100 ج.م</span>
      </div>
      
      <div class="detail-row">
        <span class="detail-label">المبلغ المدفوع:</span>
        <span class="detail-value">100 ج.م</span>
      </div>
      
      
    </div>
    
    <div class="total-section">
      <div class="total-row">
        <span>المجموع الكلي:</span>
        <span>100 ج.م</span>
      </div>
    </div>
    
    <div class="footer">
      <p>شكراً لاستخدام خدماتنا</p>
      <p>تاريخ الطباعة: ١٨‏/٦‏/١٤٤٧ هـ</p>
    </div>
  </div>
</body>
</html>
